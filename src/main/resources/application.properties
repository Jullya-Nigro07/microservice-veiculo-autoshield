spring.application.name=veiculo

server.port=0
eureka.instance.hostname=localhost
eureka.client.service-url.defaltZone=http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/autoshield_veiculos
spring.datasource.username=postgres
spring.datasource.password=${BD_PASSSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true